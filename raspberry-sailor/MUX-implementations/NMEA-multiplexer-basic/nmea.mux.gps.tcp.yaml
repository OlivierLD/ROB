#
# MUX definition.
#
name: "With a GPS, filtered (or not), -> TCP:7002"
description:
  - Reads the GPS
  - Forward on TCP:7002
context:
  with.http.server: true
  http.port: 8888
  init.cache: true
  deviation.file.name: dp_2011_04_15.csv
  markers.list:
    - markers: markers.biscay.yaml
    - markers: markers.iberica.west.yaml
channels:
  - type: serial
    port: /dev/ttyS80
    baudrate: 4800
#    sentence.filters: RMC,GLL
#    verbose: true
forwarders:
  - type: file
    # filename: data.nmea
    # flush: true
    verbose: false
    timebase.filename: true
    filename.suffix: _LOG
    log.dir: logged
    split: hour
    # sentence.filters: ~GGA,~GSV,~GSA
  - type: "tcp"
    port: 7002