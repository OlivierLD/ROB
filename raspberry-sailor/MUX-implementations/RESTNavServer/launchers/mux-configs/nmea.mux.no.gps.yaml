#
# MUX definition.
# No GPS, position will be given by -Ddefault.mux.latitude and -Ddefault.mux.longitude used to start the NavServer
# Time is system time, generated by ZDA
# Astronomical data can be rendered at http://localhost:9999/web/webcomponents/console.gps.html?style=orange&bg=black&border=n&boat-data=n
#
name: "No GPS, using ZDA"
description:
  - Can be used for tests
  - Requires python REST_BasicCacheForwarder_server.py --machine-name:localhost --port:1234 --verbose:true
  - Can test several kinds of channels, forwarders, and computers
context:
  with.http.server: true
  http.port: 9999
  init.cache: true
channels:
  - type: zda
    description: "ZDA Generator"
  - type: rest           # Pings the Python REST Server, for tests (GET)
    protocol: http
    machine-name: localhost
    # machine-name: 192.168.50.10
    http-port: 1234
    query-path: /cache-fwd/nmea-thing  # This will be a GET on the python server mentioned above.
    # query-string:      # Would include the ?, and subsequent &...
    jqs: '."nmea-data"'  # JQ String, to apply on the response. Require knowledge of what comes back.
    between-loops: 2000  # in ms
    description: "This is a REST consumer (aka channel)"
    active: false
    verbose: false
  - class: nmea.consumers.client.RandomMTWClient   # This is for debugging. Random Water Temperature
    reader: nmea.consumers.reader.RandomMTWReader
    verbose: true
    active: true
    description: "This is for debugging and illustration of a dynamic channel class. Random Water Temperature and more. Device prefix: AE, Sentences: MTW, XDR, MTA, MDA, MMB"
forwarders:
  - type: nmea-cache-publisher
    # Requires: python REST_BasicCacheForwarder_server.py --machine-name:localhost --port:1234 --verbose:true
    # PUT http://localhost:1234/cache-fwd/nmea-data
    between-loops: 1  # in seconds
    rest.protocol: http
    rest.machine-name: localhost   # The machine to send the request to
    rest.port: 1234
    rest.resource: /cache-fwd/nmea-data
    rest.verb: PUT
    option: small  # 'full', 'small', 'tiny', 'minimal'
    # rest.query.string: ""
    rest.onclose.resource: /cache-fwd/exit  # Optional. Will shut down the Python server
    rest.onclose.verb: POST
    verbose: false
    active: false
    description: "Cache publisher for Tests (requires test server to be up and running. See yaml.)"
  - type: nmea-cache-publisher
    between-loops: 5  # in seconds
    rest.protocol: http
    rest.machine-name: localhost
    # rest.machine-name: 192.168.1.103
    rest.port: 8080
    rest.resource: /ssd1306/nmea-data
    rest.verb: PUT
    option: small  # 'full', 'small', 'tiny', 'minimal'
    #    rest.query.string: ""
    rest.onclose.resource: /ssd1306/bye-and-clear-screen
    rest.onclose.verb: PUT
    verbose: false
    active: false
    description: "Cache publisher for SSD1306"
  - type: file
    # filename: data.nmea
    # flush: true
    # verbose: false # NO such prop
    timebase.filename: true
    filename.suffix: _LOG
    log.dir: logged
    split: hour
    sentence.filters: ~GGA,~GSV,~GSA
    active: false
    description: "Log in file, splitted."
  - type: "tcp"
    port: 7001
    active: false
    description: "TCP:7001"
computers:
  - type: long-term-storage   # PRMSL
    ping-interval: 900   # 15 minutes, 15 x 60s
    max-length: 672      # One week
    data-path: "Barometric Pressure,value"  # CSV list
    # Try curl -X GET http://localhost:9999/mux/cache | jq '."PRMSL-buff" | length'
    object-name: "PRMSL-buff"
    description: "Long term PRMSL storage, useful for a barograph"
    active: true
    verbose: false