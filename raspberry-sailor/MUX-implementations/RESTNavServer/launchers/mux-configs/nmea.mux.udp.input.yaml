#
# MUX definition.
# No GPS, position will be given by -Ddefault.mux.latitude and -Ddefault.mux.longitude used to start the NavServer
# Time is system time, generated by ZDA
# Astronomical data can be rendered at http://localhost:9999/web/webcomponents/console.gps.html?style=orange&bg=black&border=n&boat-data=n
#
name: "No GPS, using UDP from OpenCPN"
description:
  - Can be used for tests
  - Requires python REST_BasicCacheForwarder_server.py --machine-name:localhost --port:1234 --verbose:true
  - Can test several kinds of channels, forwarders, and computers...
context:
  with.http.server: true
  http.port: 9999
  init.cache: true
channels:
  - type: tcp
    server: "192.168.1.22"
    port: 8001
    description: "TCP => 192.168.1.22:8001..."
    active: true
    verbose: false
forwarders:
  - type: file
    # filename: data.nmea
    # flush: true
    timebase.filename: true
    filename.suffix: _LOG
    log.dir: logged
    split: hour
#    sentence.filters: ~GGA,~GSV,~GSA
#    device.filters: GP,~AE
    active: true
    verbose: true
    description: "Log in file, splitted."