#
# MUX definition.
# No GPS, position will be given by -Ddefault.mux.latitude and -Ddefault.mux.longitude used to start the NavServer
# Time is system time, generated by ZDA
# Astronomical data can be rendered at http://localhost:9999/web/webcomponents/console.gps.html?style=orange&bg=black&border=n&boat-data=n
#
name: "No GPS, using ZDA"
description:
  - Basic minimal MUX config. Can be used for tests.
#  - Just a ZDA generator, no forwarder, no computer.
  - Not even one channel
  - Some chartless maps though.
  - Admin features available
context:
  with.http.server: true
  http.port: 9999
  init.cache: true
  markers.list:
#    - markers: mux-config/waypoints/waypoints.yaml
#    - markers: mux-configs/markers/markers.sf.bay.yaml
    - markers: mux-configs/markers/markers.etel.gx.stphil.yaml
    - markers: mux-configs/markers/markers.lorient.blavet.yaml
    - markers: mux-configs/markers/markers.rade.de.brest.yaml
    - markers: mux-configs/markers/markers.glenan.yaml
    - markers: mux-configs/markers/markers.couregant.la.plate.yaml
    - markers: mux-configs/markers/markers.stphil.kerpenhir.yaml
    - markers: mux-configs/markers/markers.houat.hoedic.belle-ile.yaml
    - markers: mux-configs/markers/markers.port-navalo.vilaine.yaml
    - markers: mux-configs/markers/markers.vilaine.loire.yaml
