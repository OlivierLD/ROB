#
# MUX definition.
#
name: "ShipModul. Replay log file. Chartless Map."
description:
  - Replay a log file from the logged folder.
  - The file must obviously be here for the replay to work.
  - Markers and Borders demo/tests
  - Used by option 14 in the demoLauncher
  - Collision detection, by voice.
context:
  with.http.server: true
  http.port: 9999
  init.cache: true
  default.declination: -1
  # markers: mux-configs/markers.01.yaml
  # markers: mux-configs/markers/markers.etel.gx.stphil.yaml
  markers.list:
    - markers: mux-configs/markers/markers.etel.gx.stphil.yaml
    - markers: mux-configs/markers/markers.lorient.blavet.yaml
    # - markers: mux-configs/markers/markers.rade.de.brest.yaml
    - markers: mux-configs/markers/markers.couregant.la.plate.yaml
    - markers: mux-configs/markers/markers.stphil.kerpenhir.yaml
    - markers: mux-configs/markers/markers.houat.hoedic.belle-ile.yaml
    - markers: mux-configs/markers/markers.port-navalo.vilaine.yaml
    - markers: mux-configs/markers/markers.vilaine.loire.yaml
  next-waypoint: BMELITE
channels:
  - type: file
    filename: ./sample.data/la.reveuse.01.nmea
    between-records: 50   # Speed up
    verbose: false
    active: true
    # NEW (Sep-2026): Filters efficient on fileReaders!... (NMEAParser does the job)
    # ---------------------------------------
    device.filters: II, GP, HC, YX
    # device.filters: ~PL
    sentence.filters: ~GGA,~GSV,~GSA
    # sentence.filters: ~GGA
    description: "Reads data logged by a ShipModul. With filters."
  #
forwarders:
  - type: file
    verbose: false
    append: false
    active: true
    timebase.filename: false
    filename: data.4tests.nmea
    flush: true
    # sentence.filters: MWV, VHW, HDG... RSA:Rudder Sensor Angle
    # sentence.filters: ~GGA,~GSA,~GSV,~ROT,~XDR,~RSA
    # device.filters: ~PL,~YX,~AG
    device.filters: GP
    description: "Log the data, with filters"
#  - type: console
#  - type: tcp
#    port: 7002
  - type: gpsd
    port: 2947
    description: "To be consumed by OpenCPN"
    verbose: true
    active: false
computers:
  - class: nmea.computers.BorderManager
    properties: mux-configs/border.mgr.properties
    description: "Border manager. Will honk if too close, foghorn"
    verbose: false
  - class: nmea.computers.AISManager
    properties: mux-configs/ais.mgr.properties
    description: "AIS manager. Will detect collision threats, warnings by voice."
    verbose: false
  - class: nmea.computers.NextWaypointManager
    description: "Waypoint manager."
    verbose: false